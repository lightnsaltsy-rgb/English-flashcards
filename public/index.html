<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어학습(플래쉬카드)</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#3b6ef5">
<script>try{var t=localStorage.getItem("srs-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어학습">
<style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1f2328;--mut:#6b7280;--bd:#e3e1da;--ac:#3b6ef5;--r1:#e5484d;--r2:#e08a1e;--r3:#2f9e5b;--r4:#3b6ef5;--gray:#e6e5e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#111;--fg:#fff;--mut:#b4b4b4;--bd:#3a3a3a;--ac:#7aa2ff;--gray:#262626;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#111;--fg:#fff;--mut:#b4b4b4;--bd:#3a3a3a;--ac:#7aa2ff;--gray:#262626;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;text-align:center}
nav{display:flex;gap:6px;margin-bottom:16px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
.pk{border:1px solid var(--bd);background:var(--bg);color:var(--mut);border-radius:50%;width:32px;height:32px;cursor:pointer;flex:none}.pk.on{border-color:var(--ac);background:var(--ac)}
#sync{font-size:12px;color:var(--mut);text-align:right;margin:-6px 0 12px;cursor:pointer}
.sec{font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{padding:5px 11px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.mini{padding:3px 8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:6px;font:inherit;font-size:12px;cursor:pointer}
.go{padding:8px 12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-size:14px;cursor:pointer}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;padding:8px;border:0;background:var(--card);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}.seg button.on{background:var(--ac);color:#fff}
.stage{display:flex;flex-direction:column;height:min(50vh,380px)}
.stage .face{flex:1;min-height:0;overflow:auto;justify-content:safe center;align-items:safe center}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.act button{padding:16px 4px;border:0;border-radius:10px;color:#fff;font:inherit;font-size:16px;cursor:pointer}
.ed{min-height:90px;max-height:240px;overflow:auto;padding:10px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);white-space:pre-wrap;font-size:16px;line-height:1.5;outline:none}
.ed font[size="1"]{font-size:12px}.ed font[size="2"]{font-size:14px}.ed font[size="3"]{font-size:16px}.ed font[size="4"]{font-size:19px}.ed font[size="5"]{font-size:23px}
.opt{display:flex;gap:8px}.opt div{flex:1}.opt label{display:block;font-size:12px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:20px;color:var(--fg)}
.face{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;white-space:pre-wrap;padding:8px}
.back{border-top:1px dashed var(--bd);color:var(--ac)}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;padding:12px 4px;border:0;border-radius:10px;color:#fff;font:inherit;cursor:pointer}
.row small{display:block;opacity:.85;font-size:11px}
.b1{background:var(--r1)}.b2{background:var(--r2)}.b3{background:var(--r3)}.b4{background:var(--r4)}
.big{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
input,textarea,select{width:100%;padding:10px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
label{font-size:13px;color:var(--mut)}
.item{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.item div{flex:1;min-width:0}.item span{color:var(--mut);font-size:12px}
.item p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:0;color:var(--r1);cursor:pointer;font-size:18px}
.sm{padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;font:inherit;cursor:pointer;margin-right:6px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
input.ck{width:22px;height:22px;margin:0;padding:0;flex:none;accent-color:var(--ac);cursor:pointer}
.item .no{font-size:14px;color:var(--fg);min-width:26px;text-align:right;flex:none}
.ctl{display:flex;gap:6px;align-items:center;flex:1 1 100%}
.ctl select{width:auto;flex:1;min-width:0;margin:0;padding:8px 4px;font-size:14px}
.act3{grid-template-columns:1fr 1fr 1fr}.act .wide{grid-column:1/-1}
.act2{grid-template-columns:1fr 2fr}.act4{grid-template-columns:repeat(4,1fr)}.act4 button{font-size:15px;padding:16px 2px}.act button:disabled{opacity:.35;cursor:default}
.ed:empty:before{content:attr(data-ph);color:var(--mut);pointer-events:none}
.mini.on{background:var(--ac);border-color:var(--ac);color:#fff}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dbox{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:380px}
.mini-sel{width:auto;margin:0;padding:3px 6px;font-size:12px;border-radius:6px}
main.wide{max-width:960px}
.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:0}.cols>*{min-width:0}
.cols{align-items:stretch}
@media (max-width:700px){
  .cols{grid-template-columns:1fr}
  .cl-h,.cr-h{margin-bottom:2px}
  .item.ph{display:none}
  .cr{margin-left:18px;padding-left:8px;border-left:3px solid var(--ac);margin-bottom:6px}
  .cr:not(.ph)+.cl,.cr+.cl{margin-top:2px}
}
.item.ph{border-bottom-color:transparent}.item .nopair{color:var(--mut);font-size:12px;opacity:.55;padding-left:34px}
.item .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{border:1px solid var(--ac);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fbar{background:var(--gray);border:1px solid var(--bd);border-bottom:3px solid var(--mut);border-radius:10px 10px 0 0;padding:10px 10px 4px}
.fbar .chips{margin:0}
.fopen{border:1px solid var(--bd);border-top:0;border-radius:0 0 10px 10px;padding:14px;margin-bottom:4px}
</style>
</head>
<body>
<main>
<div style="position:relative"><h1>영어학습(플래쉬카드)</h1><button id="theme" class="mini" style="position:absolute;right:0;top:50%;transform:translateY(-50%)" onclick="toggleTheme()"></button></div>
<nav id="nav"></nav>
<div id="sync" onclick="openSync()"></div>
<div id="view"></div>
<p style="text-align:center;color:var(--mut);font-size:11px;margin:18px 0 6px">버전 2026-10-06 · v6 (이름 변경)</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const XF="잊음",LF="학습중",PL="선택카드학습중",ALL="전체학습",LIST="__list",ALLV="__allv",KEY="srs-cards-v1",MIN=60000,DAY=86400000;
let cards=[],tab="study",queue=[],shown=false,ses=null,eid=null,cur=null,xid=null,openT=false,openS=false,side=true,openL=false;
let S={order:"random",limit:0,dir:"all",skipO:false,day:"",seen:[],pick:[],dead:{},upd:0,rev:true};
try{cards=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){cards=[]}
try{S={...S,...JSON.parse(localStorage.getItem(KEY+"-s")||"{}")}}catch(e){}
const today=()=>new Date().toDateString();
if(S.day!==today()){S.day=today();S.seen=[];S.pick=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(cards));localStorage.setItem(KEY+"-s",JSON.stringify(S))}catch(e){}}
function save(){S.upd=Date.now();persist();schedSync()}
let code=null,key=null,busy=false,again=false,tm=0;
const setStat=t=>{const e=document.querySelector("#sync");if(e)e.textContent=t};
async function hash(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("srs:"+x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function mergeState(a,b){
  const m=new Map();
  for(const c of[...a.cards,...b.cards]){const l=m.get(c.id);if(!l||(c.upd||0)>(l.upd||0))m.set(c.id,c)}
  const dead={...(a.S.dead||{})};for(const k in (b.S.dead||{}))dead[k]=Math.max(dead[k]||0,b.S.dead[k]);
  for(const k in dead){const c=m.get(Number(k));if(c&&(c.upd||0)<dead[k])m.delete(Number(k))}
  const S=(b.S.upd||0)>(a.S.upd||0)?{...b.S}:{...a.S};S.dead=dead;
  return{cards:[...m.values()].sort((x,y)=>x.id-y.id),S}
}
const sig=()=>cards.length+"|"+cards.reduce((n,c)=>n+(c.upd||0),0)+"|"+S.upd;
function copyText(t){
  const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()};
  return(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).catch(fb)
}
const linkFor=c=>location.origin+location.pathname+"#code="+encodeURIComponent(c);
function codeDlg(c,intro,canChange){
  return new Promise(res=>{
    const m=document.createElement("div");m.className="dlg";
    m.innerHTML=`<div class="dbox"><b>☁️ 동기화 코드</b><p style="margin:8px 0 0;font-size:13px;color:var(--mut)">${intro}</p><input id="cdv" type="text" readonly value="${esc(c)}" style="margin:10px 0 8px;font-size:15px;text-align:center" onfocus="this.select()"><div class="row" style="margin-top:0"><button class="b4" id="cdc">📋 코드 복사</button><button class="b4" id="cdl">🔗 연결 링크 복사</button></div><p id="cdm" style="margin:8px 0 0;font-size:12px;color:var(--r3);min-height:16px"></p>${canChange?`<label style="display:block;margin-top:6px">다른 코드로 바꾸기 (다른 기기의 코드를 붙여넣기)</label><div style="display:flex;gap:6px"><input id="cdn" type="text" placeholder="코드 붙여넣기" style="margin:4px 0 0"><button class="sm" id="cdo" style="margin:4px 0 0;white-space:nowrap">변경</button></div>`:""}<button class="sm" id="cdx" style="width:100%;margin:12px 0 0;padding:12px">닫기</button></div>`;
    document.body.appendChild(m);
    const msg=t=>{m.querySelector("#cdm").textContent=t};
    m.querySelector("#cdc").onclick=()=>copyText(c).then(()=>msg("코드를 복사했어요"));
    m.querySelector("#cdl").onclick=()=>copyText(linkFor(c)).then(()=>msg("링크를 복사했어요 · 다른 기기에서 이 링크를 열면 자동으로 연결돼요"));
    m.querySelector("#cdx").onclick=()=>{m.remove();res(null)};
    const o=m.querySelector("#cdo");if(o)o.onclick=()=>{const v=m.querySelector("#cdn").value.trim();if(!v)return;m.remove();res(v)}
  })
}
async function initSync(){
  if(location.protocol==="file:"){setStat("💻 로컬 테스트 모드 · 동기화는 Netlify에 올린 뒤 켜져요");return}
  let c=localStorage.getItem("srs-code");
  const mm=(location.hash||"").match(/^#code=([A-Za-z0-9_-]{6,})$/);
  if(mm){
    history.replaceState(null,"",location.pathname+location.search);
    if(!c||c===mm[1]||confirm("이 기기의 동기화 코드를 링크의 코드로 바꿀까요?")){c=mm[1];localStorage.setItem("srs-code",c)}
  }
  if(!c){
    c=(prompt("동기화 코드를 입력하세요.\n이미 다른 기기에서 쓰고 있다면 그 코드를 붙여넣고, 처음이라면 비워두고 확인을 누르세요.\n(다른 기기의 '연결 링크'를 열어도 자동으로 연결돼요)")||"").trim();
    if(!c){
      c=Array.from(crypto.getRandomValues(new Uint8Array(20)),x=>"abcdefghjkmnpqrstuvwxyz23456789"[x%31]).join("");
      localStorage.setItem("srs-code",c);
      await codeDlg(c,"새 동기화 코드가 만들어졌어요. 아래 버튼으로 복사해서 메모해 두세요. 다른 기기에서는 '연결 링크'를 열거나 코드를 붙여넣으면 돼요. (나중에 화면 위 ☁️ 줄을 눌러도 볼 수 있어요)",false)
    }
    localStorage.setItem("srs-code",c)
  }
  code=c;key=await hash(c);sync(true)
}
async function openSync(){
  const v=await codeDlg(code||"","다른 기기에서 같은 코드를 입력하거나, '연결 링크'를 보내서 열면 카드가 동기화돼요.",true);
  if(v&&v!==code){code=v;localStorage.setItem("srs-code",v);hash(v).then(k=>{key=k;sync(true)})}else sync(true)
}
function schedSync(){if(!key)return;clearTimeout(tm);tm=setTimeout(()=>sync(false),1200)}
async function sync(ui){
  if(!key)return;
  if(busy){again=true;return}
  busy=true;setStat("☁️ 동기화 중…");
  try{
    const before=sig();
    const r=await fetch("/api/sync",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({k:key,cards,S})});
    if(!r.ok)throw new Error(r.status);
    const res=mergeState({cards,S},await r.json());
    cards=res.cards;S=res.S;const ids=new Set(cards.map(c=>c.id));queue=queue.filter(id=>ids.has(id));persist();
    setStat("☁️ 동기화됨 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})+" · 눌러서 코드 확인");
    if(ui&&sig()!==before&&!ses&&eid===null)render()
  }catch(e){setStat("☁️ 오프라인 · 연결되면 자동으로 동기화돼요")}
  busy=false;if(again){again=false;schedSync()}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync(true)});
addEventListener("online",()=>sync(true));
document.addEventListener("selectionchange",updSz);
document.addEventListener("keydown",e=>{
  if(!ses||eid!==null||tab!=="study"||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target;if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(t.tagName)))return;
  const k=e.key,ok=k===" "||k==="Enter"||k==="ArrowRight";
  if(!cards.some(x=>x.id===queue[0]))return;
  if(!shown){if(ok){e.preventDefault();shown=true;render()}return}
  if(ses.view){if(ok){e.preventDefault();nxt()}return}
  if(k==="1"){e.preventDefault();mark(true)}else if(k==="2"){e.preventDefault();mark(false)}else if(ses.pl&&(ok||k==="3")){e.preventDefault();nxt()}
});
setInterval(()=>{if(!document.hidden)sync(true)},20000);
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=c=>(c.deck===XF||c.deck===LF)?(c.home||"기본"):c.deck;
const folders=()=>{
  const k=new Map(),put=(n,t)=>{if(!n||n===XF||n===LF)return;k.set(n,Math.min(k.has(n)?k.get(n):Infinity,t))};
  (S.fnames||[]).forEach(n=>put(n,(S.ftime||{})[n]||0));
  cards.forEach(c=>put(fd(c),c.id));
  const fo=S.forder||[];return[...k.keys()].sort((a,b)=>{const ia=fo.indexOf(a),ib=fo.indexOf(b);if(ia>=0&&ib>=0)return ia-ib;if(ia>=0)return -1;if(ib>=0)return 1;return k.get(a)-k.get(b)||a.localeCompare(b)})
};
function mkF(n){S.fnames=S.fnames||[];S.ftime=S.ftime||{};if(n&&!S.fnames.includes(n)){S.fnames.push(n);S.ftime[n]=Date.now()}}
const nk=c=>[fd(c),c.front,c.back].map(x=>String(x).replace(/\s+/g," ").trim()).join("\u0001");
let FL=[],FN=[],FA=[],FK=[],addF=null;
const hideF=()=>S.hideF||[];
const chk=()=>folders().filter(f=>!hideF().includes(f));
const inList=c=>c.deck!==XF&&c.deck!==LF&&chk().includes(c.deck);
const dirOk=(c,d)=>d==="ko"?isKo(c):d==="en"?!isKo(c):true;
const op=k=>({order:"random",dir:"all",...((S.opt||{})[k]||{})});
function setSes(f,v){const k=ses.from,old=ses;S.opt=S.opt||{};const pv=(S.opt[k]||{})[f];S.opt[k]={...(S.opt[k]||{}),[f]:v};start(ses.from,ses.home);if(ses===old){if(pv===undefined)delete S.opt[k][f];else S.opt[k][f]=pv;render()}save()}
function dirNote(){
  const d=ses.opt.dir;if(d==="all")return"";
  const src=srcCards(),hid=src.length-src.filter(c=>dirOk(c,d)).length;
  return hid>0?`<div class="note">방향 설정(${d==="ko"?"한→영":"영→한"}) 때문에 ${hid}장은 나오지 않아요 <button class="mini" onclick="setSes('dir','all')">전체 방향으로 보기</button></div>`:""
}
function sesCtl(){const o=op(ses.from),f=(k,v,a)=>`<select onchange="setSes('${k}',this.value)">${a.map(([x,t])=>`<option value="${x}" ${v===x?"selected":""}>${t}</option>`).join("")}</select>`;return f("order",o.order,[["random","랜덤"],["seq","입력순"]])+f("dir",o.dir,[["all","전체"],["ko","한→영"],["en","영→한"]])}
function start(name,home){
  const pk=name==="__pick"||name===LF||name===PL,lp=name===LF||name===PL,o=op(name);
  let l=pk?cards.filter(c=>S.pick.includes(c.id)):cards.filter(c=>name===LIST?inList(c):name===ALL?(c.deck!==XF&&c.deck!==LF):name===XF?c.deck===XF&&(!home||(c.home||"기본")===home):c.deck===name);

function initDrag(){
  const bar=document.querySelector("#chipbar");if(!bar)return;

    ch.addEventListener("click",e=>{if(noClick){e.stopImmediatePropagation();e.preventDefault()}},true);
    ch.addEventListener("pointerdown",e=>{
      if(e.button>0)return;
      const sx=e.clientX,sy=e.clientY,pid=e.pointerId;let drag=false,ghost=null,ox=0,oy=0;
      const move=ev=>{
        if(ev.pointerId!==pid)return;
        if(!drag){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<7)return;
          drag=true;const r=ch.getBoundingClientRect();ox=sx-r.left;oy=sy-r.top;
          ghost=ch.cloneNode(true);ghost.style.cssText="position:fixed;z-index:99;pointer-events:none;opacity:.9;box-shadow:0 4px 12px rgba(0,0,0,.3);left:0;top:0;width:"+r.width+"px";document.body.appendChild(ghost);
          ch.style.opacity=".3";try{ch.setPointerCapture(pid)}catch(x){}}
        ev.preventDefault();
        ghost.style.transform="translate("+(ev.clientX-ox)+"px,"+(ev.clientY-oy)+"px)";
        ghost.style.display="none";const t=document.elementFromPoint(ev.clientX,ev.clientY);ghost.style.display="";
        const o=t&&t.closest&&t.closest(".chip[data-f]");
        if(o&&o!==ch&&bar.contains(o)){const r=o.getBoundingClientRect(),after=ev.clientX>r.left+r.width/2;
          const same=Math.abs((r.top+r.height/2)-(ch.getBoundingClientRect().top+ch.getBoundingClientRect().height/2))<r.height/2;

      };

        if(ev.pointerId!==pid)return;
        removeEventListener("pointermove",move);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
        if(!drag)return;
        if(ghost)ghost.remove();ch.style.opacity="";

        const names=[...bar.querySelectorAll(".chip[data-f]")].map(b=>FN[+b.dataset.f]);

      };
      addEventListener("pointermove",move,{passive:false});addEventListener("pointerup",up);addEventListener("pointercancel",up)
    })
  })
}

  m.querySelector("#dok").onclick=()=>{
    let t=sel.value;
    if(t==="__new"){t=nw.value.trim();if(!t){alert("새 폴더 이름을 입력해 주세요.");return}if(t===XF||t===LF){alert("'"+t+"'은(는) 폴더 이름으로 쓸 수 없어요.");return}}
    const dc=m.querySelector("#dc"),rv=m.querySelector("#drv").checked;m.remove();doImport(list,t,!!(dc&&dc.checked),rv)
  }
}
function doImport(list,target,useC,rev){
  rev=rev===undefined?!!S.rev:!!rev;S.rev=rev;
  const t=Date.now();
  const add=list.flatMap((x,i)=>{
    const dk=(useC&&x[2]&&x[2]!==XF&&x[2]!==LF)?x[2]:target;
    const mk=(id,f,b)=>({id,front:f,back:b,deck:dk,ef:2.5,int:0,reps:0,due:t,upd:t});
    return rev?[mk(t+2*i/1000,x[0],x[1]),mk(t+(2*i+1)/1000,x[1],x[0])]:[mk(t+i/1000,x[0],x[1])]
  });
  const have=new Map();cards.forEach(c=>{const k=nk(c);if(!have.has(k))have.set(k,c)});
  const fresh=[],skip=[];
  add.forEach(c=>{const e=have.get(nk(c));if(e)skip.push([c,e]);else fresh.push(c)});
  cards=cards.concat(fresh);
  mkF(target);fresh.forEach(c=>mkF(c.deck));
  cur=target;side=true;save();render();
  const where=e=>e.deck===XF?"잊음 폴더":"'"+e.deck+"' 폴더",one=x=>x.split("\n")[0];
  alert(fresh.length+"장을 '"+target+"' 폴더"+(useC?"(및 C열 폴더)":"")+"에 가져왔어요"+(rev?" (한→영 "+fresh.filter(isKo).length+"장 · 영→한 "+fresh.filter(c=>!isKo(c)).length+"장)":"")+(skip.length?"\n\n앱에 이미 같은 카드가 있어서 건너뛴 "+skip.length+"장:\n"+skip.slice(0,8).map(([c,e])=>"· "+one(c.front)+" → "+one(c.back)+" ("+where(e)+"에 있음)").join("\n")+(skip.length>8?"\n… 외 "+(skip.length-8)+"장":""):""))
}
function imp(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const a=JSON.parse(r.result);if(Array.isArray(a)){const t0=Date.now(),add=a.filter(x=>x.front&&x.back).sort((p,q)=>(p.id||0)-(q.id||0)).map((x,i)=>({ef:2.5,int:0,reps:0,due:t0,deck:"기본",...x,upd:t0,id:t0+i/1000}));const n=addNew(add),sk=add.length-n;save();render();alert(n+"장을 가져왔어요"+(sk?" (이미 있는 "+sk+"장은 건너뛰었어요)":""))}}catch(e){alert("파일을 읽을 수 없어요")}};
  r.readAsText(f)
}
cards.forEach(c=>{if(c.deck===LF){c.deck=c.home||"기본";c.upd=Date.now()}});
try{document.execCommand("defaultParagraphSeparator",false,"br")}catch(e){}
themeBtn();
render();initSync();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});

</script>
